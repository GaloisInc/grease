name: docker

on:
  push:
    branches:
    - main
  pull_request:
    # Don't run on documentation-only changes
    paths-ignore:
    - '**.md'
  workflow_dispatch:

permissions: {}

jobs:
  build-image:
    runs-on: ${{ matrix.os }}
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
        github.event.pull_request.head.repo.fork == false &&
        github.repository_owner == 'GaloisInc'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Cover both x86-64 and ARM64.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        image:
          - name: grease
            repo: ghcr.io/galoisinc/grease
          - name: screach
            repo: ghcr.io/galoisinc/screach
    # The default is 360 (i.e., 6 hours), which can be wasteful. See:
    # https://github.com/Cambridge-ICCS/green-ci/blob/b9e942d81e4d6536d69f3cfbffe28fa14b8ae381/README.md#time-limits
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # https://github.com/actions/checkout/issues/485
          persist-credentials: false
          submodules: true

      - name: Generate grease.buildinfo.json
        shell: bash
        run: .github/ci.sh generate_buildinfo "${{ github.sha }}" main

      - name: Set up Docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image.repo }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,manifest-descriptor

      - name: Log in to ghcr.io
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          target: ${{ matrix.image.name }}
          tags: ${{ matrix.image.repo }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.image.name }}
          touch "${{ runner.temp }}/digests/${{ matrix.image.name }}/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image.name }}-${{ runner.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.image.name }}/*
          if-no-files-found: error
          retention-days: 1

  push-image:
    runs-on: ubuntu-24.04
    needs: [build-image]
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
        github.event.pull_request.head.repo.fork == false &&
        github.repository_owner == 'GaloisInc'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: grease
            repo: ghcr.io/galoisinc/grease
          - name: screach
            repo: ghcr.io/galoisinc/screach
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # https://github.com/actions/checkout/issues/485
          persist-credentials: false
          submodules: true

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests/${{ matrix.image.name }}
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Log in to ghcr.io
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image.repo }}
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests/${{ matrix.image.name }}
        # Build and run a complex command line with eval to avoid wrong word splitting on spaces in the annotations.
        run: |
          eval "docker buildx imagetools create ${ANNOTATIONS} \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(jq -cr '.annotations | map("--annotation \"" + . + "\"") | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ matrix.image.repo }}@sha256:%s ' *)"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect ${{ matrix.image.repo }}:${VERSION}
