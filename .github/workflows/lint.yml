name: lint

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: lint
    # The default is 360 (i.e., 6 hours), which can be wasteful. See:
    # https://github.com/Cambridge-ICCS/green-ci/blob/b9e942d81e4d6536d69f3cfbffe28fa14b8ae381/README.md#time-limits
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # https://github.com/actions/checkout/issues/485
          persist-credentials: false
          submodules: false

      - uses: haskell-actions/run-fourmolu@1b9df64b784203126500372730b9725c97e4040b # v13
        name: Check formatting with fourmolu
        with:
          version: "0.19.0.0"

      - name: Lint GitHub Actions workflows with zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          version: "1.26.1"
          advanced-security: false

      - name: Setup Ghidra
        id: ghidra
        uses: ./.github/actions/ghidra-install

      - name: Lint GREASE Ghidra plugin Scala
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ steps.ghidra.outputs.ghidra-install-dir }}
        run: cd ghidra-plugin && ./gradlew spotlessCheck

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # Ghidra 11.4.2 requires Gradle >= 8.5; match the ghidra-plugin wrapper.
          gradle-version: "8.13"

      - name: Lint Screach Ghidra plugin Java
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ steps.ghidra.outputs.ghidra-install-dir }}
        run: cd screach/ghidra && gradle lintJava

      - name: Lint ECFS Ghidra extension Java
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ steps.ghidra.outputs.ghidra-install-dir }}
        run: cd ghidra-ecfs && gradle lintJava

      - name: Check for broken links
        uses: langston-barrett/mdlynx/.github/actions/mdlynx@52be75d5b84891e3ef1f507d6c8c25d0fbfc10b8 # v0.3.0

      # action was added more recently than most recent release, so just pin with SHA
      - uses: langston-barrett/ttlint/.github/actions/install-ttlint@46076e39ddef3af2b32f12a2b12f04740cdcc7fd
        with:
          version: "0.1.0"

      - run: git ls-files -z --exclude-standard '*.cabal' '*.hs' '*.md' '*.py' '*.scala' | xargs -0 ttlint

      - name: Install ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

      - name: Ensure python files are formatted
        run: ruff format --check --diff $(git ls-files '*.py')

      - name: Lint python files with ruff
        run: ruff check $(git ls-files '*.py')

      - name: Run hlint
        run: |
          curl \
            --fail \
            --location \
            --proto '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            https://github.com/ndmitchell/hlint/releases/download/v3.8/hlint-3.8-x86_64-linux.tar.gz | \
            tar xzf - hlint-3.8/hlint
          ./hlint-3.8/hlint grease{,-aarch32,-llvm,-ppc,-x86}/src grease-cli/src grease-exe/{main,src,tests}

      - name: Spell check
        # We pin a specific version because updates can come with additional
        # typo fixes. These could break CI unexpectedly if we just pinned @v1.
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          files: |
            doc/
            ghidra-plugin/src/main/help/
            screach/ghidra/src/main/help/

      - name: Check cross-references with tagref
        run: |
          mkdir -p ~/.bin
          curl \
            --fail \
            --location \
            --proto '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            https://github.com/stepchowfun/tagref/releases/download/v1.12.1/tagref-x86_64-unknown-linux-gnu > \
            ~/.bin/tagref
          chmod +x ~/.bin/tagref
          ~/.bin/tagref

      - name: Find stale TODOs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 scripts/lint/stale-todo.py
          $(git ls-files '*.cabal')
          $(git ls-files '*.hs')
          $(git ls-files '*.md')
          $(git ls-files '*.py')
          $(git ls-files '*.scala')
